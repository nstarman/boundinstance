# Codecov configuration. https://docs.codecov.com/docs/codecov-yaml
#
# Coverage is uploaded from exactly one job: the 3.12/ubuntu leg of the `tests`
# matrix in ci.yml. The other eight legs run coverage too, but this package has
# no platform-specific code and `[tool.coverage] report.fail_under = 100` fails
# any leg that drops below 100%, so nine identical uploads would add nothing
# except the race Codecov has when it evaluates a partial set.
#
# Because `fail_under` already enforces the number in CI, Codecov's own statuses
# are informational here: they annotate the diff and draw the graph, but they do
# not gate a merge. `CI Pass` is the required check, and it already covers the
# job that would have failed.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "condensed_header, diff, files"
  require_changes: true
