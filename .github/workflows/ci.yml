name: CI

on:
  # Only `main`. A branch with an open pull request is covered by the
  # `pull_request` event; without this filter both events fire for the same
  # commit, land in the same concurrency group below, and `cancel-in-progress`
  # kills the push run seconds after it starts.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: 3

jobs:
  pre-commit:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v7
        with: { python-version: "3.12" }
      - run: uv run --group lint pre-commit run --all-files
        env:
          # `no-commit-to-branch` exists to stop a developer committing straight
          # to `main` locally. CI is not a commit: on a push to `main` the
          # checkout *is* on `main`, so the hook fails every merge. (On a
          # pull_request it passes only because checkout leaves a detached HEAD
          # at the merge ref, which is why this went unnoticed until #5 merged.)
          SKIP: no-commit-to-branch

  typecheck:
    name: Typecheck (mypy + pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v7
        with: { python-version: "3.12" }
      - run: uv run --group nox nox -s typecheck

  tests:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # `id-token: write` is for Codecov's OIDC upload, so no `CODECOV_TOKEN`
    # secret is needed. Because this job now holds a privileged token, its
    # actions are pinned to commit SHAs (see `publish.yml` for the same rule).
    permissions:
      contents: read
      id-token: write # Codecov's OIDC upload
      code-quality: write # GitHub's own code-coverage ingestion
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with: { python-version: "${{ matrix.python }}" }
      - run:
          uv run --group test pytest tests docs src README.md
          --cov=boundinstance --cov-report=xml --cov-report=term

      # Upload from one leg only. This package has no platform-specific code
      # and `fail_under = 100` is enforced on every leg, so nine identical
      # reports would add nothing -- and Codecov evaluates as soon as the first
      # upload lands, posting a spurious red status against a partial set until
      # the rest arrive. galax hit that repeatedly with five uploads.
      - name: Upload coverage report
        if: matrix.python == '3.12' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage.xml
          fail_ci_if_error: true

      # GitHub's own code coverage, which reads the same Cobertura XML and
      # annotates the pull request diff directly. The fork guard is from
      # GitHub's documented example: a pull request from a fork cannot be
      # granted `code-quality: write`, so the upload would fail there.
      - name: Upload coverage to GitHub
        if: >-
          matrix.python == '3.12' && matrix.os == 'ubuntu-latest' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-code-coverage@bfa741d815a28cb064a8e3a0837e577457a017d5 # v1.4.3
        with:
          file: coverage.xml
          language: Python
          label: code-coverage/pytest
      # `--assert=plain` disables assertion rewriting, which is the only way to
      # catch a test that chains onto a temporary (e.g. `Host().d.enclosing`)
      # whose weak reference dies before the assertion runs. Assertion
      # rewriting incidentally keeps such temporaries alive via synthetic
      # locals, masking the bug under default pytest.
      - run: uv run --group test pytest tests -q --assert=plain

  test-mypyc:
    name: Test mypyc wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v7
        with: { python-version: "3.12" }
      - name: Build the compiled wheel
        run: uv run --group build python -m build --wheel
        env:
          HATCH_BUILD_HOOKS_ENABLE: "1"
      - name: Install it
        run: uv pip install dist/*.whl
      - name: Verify it is compiled
        run:
          uv run --no-sync python -c "import boundinstance;
          print(boundinstance.COMPILED); assert boundinstance.COMPILED"
      - name: Run the suite against the wheel
        run:
          uv run --group test --no-sync pytest tests -m "not
          incompatible_with_mypyc"
        env:
          BOUNDINSTANCE_EXPECT_COMPILED: "1"

  benchmarks:
    name: Benchmarks (CodSpeed)
    runs-on: ubuntu-latest
    # OIDC authentication: no `CODSPEED_TOKEN` secret is required.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with: { python-version: "3.12" }
      - run: uv sync --group bench
      - uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          mode: simulation
          run: uv run --no-sync pytest tests/benchmark --codspeed

  status:
    name: CI Pass
    runs-on: ubuntu-latest
    # `!cancelled()` so the gate still reports when an upstream job fails. A
    # plain `needs:` would skip this job instead, and a skipped required check
    # never resolves -- branch protection would wait forever.
    if: ${{ !cancelled() }}
    # `benchmarks` is deliberately absent: CodSpeed is measurement
    # infrastructure, and a service hiccup there should not block a merge.
    # unxt's own `CI Pass` excludes its benchmark job for the same reason.
    needs: [pre-commit, typecheck, tests, test-mypyc]
    steps:
      - name: All required jobs passed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
