name: Build and Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # Real releases key off the tag ref (`refs/tags/vX.Y.Z`), which is unique
  # per release, so this only ever cancels a redundant re-run of the *same*
  # ref -- e.g. a second `workflow_dispatch` fired against a branch while an
  # earlier one is still running.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 } # hatch-vcs needs the tag
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with: { python-version: "3.12" }
      - run: uv build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: sdist, path: dist/*.tar.gz }

  generate-matrix:
    name: Generate wheels matrix
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.set.outputs.include }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Enumerate build identifiers
        run: |
          uvx cibuildwheel==3.4.0 --print-build-identifiers --platform linux \
            | jq -nRc '{"only": inputs, "os": "ubuntu-latest"}' > /tmp/linux.json
          uvx cibuildwheel==3.4.0 --print-build-identifiers --platform macos \
            | jq -nRc '{"only": inputs, "os": "macos-14"}' > /tmp/macos.json
          uvx cibuildwheel==3.4.0 --print-build-identifiers --platform windows \
            | jq -nRc '{"only": inputs, "os": "windows-latest"}' > /tmp/windows.json
      - id: set
        run: echo "include=$(jq -sc '.' /tmp/*.json)" >> "$GITHUB_OUTPUT"

  wheels:
    name: Build ${{ matrix.only }}
    needs: generate-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.include) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: pypa/cibuildwheel@54a71d3375df80d84b6d4537d04614fec04e637f # v3.4.0
        with: { only: "${{ matrix.only }}" }
        env: { CIBW_BUILD_VERBOSITY: 1 }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: "wheel-${{ matrix.only }}", path: wheelhouse/*.whl }

  test-publish:
    name: Publish to TestPyPI
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    if:
      github.event_name == 'release' || (github.event_name ==
      'workflow_dispatch' && inputs.publish)
    environment:
      name: testpypi
      url: https://test.pypi.org/p/boundinstance
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { path: dist, merge-multiple: true }
      - run: ls -la dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          # A version already on TestPyPI, or any TestPyPI flake, must not be
          # able to fail this job and silently skip the PyPI publish below.
          skip-existing: true

  publish:
    name: Publish to PyPI
    needs: [test-publish]
    runs-on: ubuntu-latest
    if:
      github.event_name == 'release' || (github.event_name ==
      'workflow_dispatch' && inputs.publish)
    environment:
      name: pypi
      url: https://pypi.org/p/boundinstance
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { path: dist, merge-multiple: true }
      - run: ls -la dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          # This job uploads a dozen-plus files in one call. If it dies
          # partway through (network blip, runner drop), some files are
          # already on PyPI; without this, a retry fails immediately on the
          # first already-uploaded file and never reaches the rest, leaving
          # the release stuck on a burned version number. PyPI files are
          # immutable, so a duplicate here is always byte-identical to what's
          # already live -- this only makes the retry idempotent, it can't
          # mask a bad artifact.
          skip-existing: true
